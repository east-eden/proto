syntax = "proto3";
package proto;

option go_package = "github.com/east-eden/server/proto/global";
option csharp_namespace = "proto";

// VIP 状态
message VipInfo {
  int32 Level = 1;   // 当前 VIP 等级
  int32 Exp = 2;     // 当前等级内经验
  int32 NextExp = 3; // 升到下一级所需经验
}

// 充值订单
message RechargeOrder {
  string Id = 1;
  int32 GoodsId = 2;
  int32 Count = 3;
  int32 Status = 4; // 0=待支付 1=已发货
}

// 创建充值订单
message C2S_RechargeCreate {
  int32 GoodsId = 1;
  int32 Count = 2;
}

// 订单信息
message S2C_RechargeOrder {
  RechargeOrder Order = 1;
}

// 领取首充奖励
message C2S_FirstRechargeClaim {
  int32 RechargeId = 1;
  int32 Day = 2;
}

// VIP 状态同步
message S2C_VipInfo {
  VipInfo Info = 1;
}
